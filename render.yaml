databases:
  - name: ehub-postgres
    databaseName: ehub_db
    user: ehub_user
    plan: free

services:
  # 1. Spring Boot REST Backend
  - type: web
    name: ehub-backend
    runtime: docker
    dockerContext: ./ehub-backend
    dockerfilePath: ./ehub-backend/Dockerfile
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ehub-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set your Gemini API key in Render dashboard
      - key: APPLICATION_CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. React Vite SPA Frontend
  - type: web
    name: ehub-ui
    runtime: static
    buildCommand: cd ehub-ui && npm install && npm run build
    staticPublishPath: ehub-ui/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ehub-backend.onrender.com/api
