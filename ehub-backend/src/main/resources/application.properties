spring.application.name=ehub-backend
server.port=8080

# Database Configuration (PostgreSQL with fallback to H2 if Postgres is unavailable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ehub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ehub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ehub_password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (available for development if H2 profile is used)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security / JWT Configuration
application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:mock-key}
gemini.api.model=gemini-1.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Mail / OTP Configuration (Default dummy; OTP will also be logged to console in dev)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Async Task Executor Configuration
application.async.core-pool-size=5
application.async.max-pool-size=20
application.async.queue-capacity=100
application.async.thread-name-prefix=EHubAsync-

# CORS Configuration
application.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
